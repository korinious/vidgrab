name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs. Pull requests (also from forks)
# only run read-only jobs: the token is read-only and no secrets are used anywhere.
permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The uv that writes uv.lock; a different one may rewrite its format ("revision").
  UV_VERSION: "0.12.24"
  # Pinned external tools. To bump one, change the version/URL *and* the SHA256.
  # FFmpeg "essentials" build by gyan.dev (GPL), mirrored on GitHub.
  FFMPEG_VERSION: "8.0"
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/8.0/ffmpeg-8.0-essentials_build.zip
  FFMPEG_ZIP_SHA256: 647e467caf82b9fa200a562769b5ff4d736aaf725804ed2c64ea9752106fa569
  # Deno: SHA256 of deno.exe itself (identical to the binary in the @deno/win32-x64 npm package).
  DENO_VERSION: "2.9.6"
  DENO_URL: https://github.com/denoland/deno/releases/download/v2.9.6/deno-x86_64-pc-windows-msvc.zip
  DENO_EXE_SHA256: 2ff9493dfa356be2975f477025ea770088e9e9cb2c83d983236d13561b96b7a6
  # Source of the bundled FFmpeg (tag n8.0 = commit 140fd653ae, as the build's README
  # says), attached to every release for the GPL. Empty = print the hash and fail.
  FFMPEG_SRC_URL: https://ffmpeg.org/releases/ffmpeg-8.0.tar.xz
  FFMPEG_SRC_SHA256: ""

jobs:
  # Runs on Linux first: a path that is invalid on Windows makes the Windows checkout
  # itself fail, before any step could explain why.
  paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject paths that are invalid on Windows
        run: python3 scripts/check_paths.py

  test:
    needs: paths
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Determine version
        id: version
        run: |
          $version = (uv run python -c "import vidgrab; print(vidgrab.__version__)").Trim()
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -ne "v$version") {
              throw "Tag $tag does not match vidgrab.__version__ ($version)"
            }
            # Fail before the long build, not after it.
            if (-not (Test-Path "docs/release-notes/$tag.md")) {
              throw "Missing release notes: docs/release-notes/$tag.md"
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "VidGrab $version"

      - name: Download FFmpeg (pinned)
        run: |
          New-Item -ItemType Directory -Force -Path bin, downloads | Out-Null
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile downloads/ffmpeg.zip
          $hash = (Get-FileHash downloads/ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "ffmpeg zip sha256: $hash"
          if (-not $env:FFMPEG_ZIP_SHA256) {
            throw "FFMPEG_ZIP_SHA256 is not pinned yet. Verify and set it in build.yml: $hash"
          }
          if ($hash -ne $env:FFMPEG_ZIP_SHA256) {
            throw "FFmpeg SHA256 mismatch: expected '$env:FFMPEG_ZIP_SHA256', got '$hash'"
          }
          Expand-Archive downloads/ffmpeg.zip -DestinationPath downloads/ffmpeg
          $root = Get-ChildItem downloads/ffmpeg -Directory | Select-Object -First 1
          Copy-Item "$($root.FullName)/bin/ffmpeg.exe", "$($root.FullName)/bin/ffprobe.exe" bin/
          Copy-Item "$($root.FullName)/LICENSE" downloads/FFMPEG-LICENSE.txt
          Copy-Item "$($root.FullName)/README.txt" downloads/FFMPEG-README.txt
          ./bin/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          ./bin/ffmpeg.exe -hide_banner -buildconf | Out-File -Encoding utf8 downloads/FFMPEG-BUILDCONF.txt

      # THIRD-PARTY-NOTICES.md lists the configure flags of the bundled build; when
      # FFmpeg is bumped, this fails until the notices are updated too.
      - name: Check FFmpeg build configuration against THIRD-PARTY-NOTICES.md
        run: uv run python scripts/check_ffmpeg_buildconf.py THIRD-PARTY-NOTICES.md downloads/FFMPEG-BUILDCONF.txt

      - name: Download Deno (pinned)
        run: |
          Invoke-WebRequest -Uri $env:DENO_URL -OutFile downloads/deno.zip
          Expand-Archive downloads/deno.zip -DestinationPath downloads/deno
          $hash = (Get-FileHash downloads/deno/deno.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "deno.exe sha256: $hash"
          if ($hash -ne $env:DENO_EXE_SHA256) {
            throw "deno.exe SHA256 mismatch: expected '$env:DENO_EXE_SHA256', got '$hash'"
          }
          Copy-Item downloads/deno/deno.exe bin/
          ./bin/deno.exe --version

      - name: Build with PyInstaller (--onedir)
        run: >
          uv run pyinstaller
          --noconfirm --clean
          --onedir --windowed
          --name VidGrab
          --icon src/vidgrab/ui/assets/vidgrab.ico
          --collect-data vidgrab
          --paths src
          --add-binary "bin/ffmpeg.exe;bin"
          --add-binary "bin/ffprobe.exe;bin"
          --add-binary "bin/deno.exe;bin"
          packaging/vidgrab_launcher.py

      - name: Self-check the built app
        run: |
          $p = Start-Process -FilePath dist/VidGrab/VidGrab.exe `
            -ArgumentList '--self-check', '--report', "$PWD/selfcheck.txt" `
            -Wait -PassThru -NoNewWindow
          if (Test-Path selfcheck.txt) { Get-Content selfcheck.txt }
          if ($p.ExitCode -ne 0) { throw "Self-check failed with exit code $($p.ExitCode)" }

      # VidGrab's GPL-3.0 text, the notices with source links, and the license of every
      # bundled component (FFmpeg, Deno, Qt, Python and each Python package).
      - name: Add licenses and zip
        id: zip
        run: |
          $lic = New-Item -ItemType Directory -Force -Path dist/VidGrab/licenses
          Copy-Item LICENSE dist/VidGrab/LICENSE.txt
          Copy-Item THIRD-PARTY-NOTICES.md, README.md dist/VidGrab/
          Copy-Item LICENSES/* $lic
          Copy-Item downloads/FFMPEG-LICENSE.txt, downloads/FFMPEG-README.txt, downloads/FFMPEG-BUILDCONF.txt $lic
          uv run python scripts/third_party_licenses.py "$($lic.FullName)/python"
          if ($LASTEXITCODE -ne 0) { throw "Collecting the Python package licenses failed" }
          $zip = "VidGrab-${{ steps.version.outputs.version }}-win64.zip"
          Compress-Archive -Path dist/VidGrab -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          # sha256sum format with LF; the app verifies the download against it.
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", "$hash  $zip`n")
          Get-Content SHA256SUMS.txt
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Get-Item $zip | Format-Table Name, Length

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VidGrab-${{ steps.version.outputs.version }}-win64
          path: |
            ${{ steps.zip.outputs.zip }}
            SHA256SUMS.txt
          if-no-files-found: error

  # The FFmpeg source for the GPL, attached to every release next to the zip.
  ffmpeg-source:
    needs: paths
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download FFmpeg source (pinned)
        run: |
          name="$(basename "$FFMPEG_SRC_URL")"
          curl -fsSL --retry 3 -o "$name" "$FFMPEG_SRC_URL"
          hash="$(sha256sum "$name" | cut -d' ' -f1)"
          echo "$name sha256: $hash"
          if [ -z "$FFMPEG_SRC_SHA256" ]; then
            echo "::error::FFMPEG_SRC_SHA256 is not pinned yet. Verify and set it in build.yml: $hash"
            exit 1
          fi
          if [ "$hash" != "$FFMPEG_SRC_SHA256" ]; then
            echo "::error::FFmpeg source SHA256 mismatch: expected $FFMPEG_SRC_SHA256, got $hash"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-source
          path: ffmpeg-*.tar.xz
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, ffmpeg-source]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the assets, fill an empty release body
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release notes
        run: |
          notes="docs/release-notes/${TAG}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::Missing or empty release notes: $notes"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # all artifacts of this run: the zip + SHA256SUMS.txt, and the FFmpeg source
          merge-multiple: true

      - name: Verify the zip against SHA256SUMS.txt
        run: sha256sum --check --strict SHA256SUMS.txt

      # Releases are usually created in the GitHub UI (this session cannot push tags) with an
      # empty description. Then: attach the zip, SHA256SUMS.txt (the app's update download
      # is verified against it) and the FFmpeg source, and fill an empty body from the notes file.
      # A body that already has text is never changed, and neither is the title.
      # A release that doesn't exist yet is created from the notes file.
      - name: Publish release
        run: |
          shopt -s failglob
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists: uploading the zip"
            gh release upload "$TAG" VidGrab-*-win64.zip SHA256SUMS.txt ffmpeg-*.tar.xz \
              --clobber --repo "$GITHUB_REPOSITORY"
            body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              echo "Release body is empty: filling it from docs/release-notes/${TAG}.md"
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
                --notes-file "docs/release-notes/${TAG}.md"
            else
              echo "Release body already has text: left unchanged"
            fi
          else
            echo "Creating release $TAG from docs/release-notes/${TAG}.md"
            gh release create "$TAG" VidGrab-*-win64.zip SHA256SUMS.txt ffmpeg-*.tar.xz \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "VidGrab ${TAG}" \
              --notes-file "docs/release-notes/${TAG}.md"
          fi
