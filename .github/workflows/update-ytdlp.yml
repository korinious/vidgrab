name: Update yt-dlp

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: windows-latest
    permissions:
      contents: write # push the automation/update-yt-dlp branch
      pull-requests: write # open the PR
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Same uv as build.yml; another version may rewrite uv.lock's format (#6).
          version: "0.12.24"

      - name: Upgrade yt-dlp in uv.lock
        run: |
          Copy-Item uv.lock "$env:RUNNER_TEMP/uv.lock.before"
          uv lock --upgrade-package yt-dlp --upgrade-package yt-dlp-ejs

      # Only a new yt-dlp or yt-dlp-ejs version is an update. uv may rewrite uv.lock for
      # other reasons (a newer uv bumped "revision" in #6), which must not open a PR.
      - name: Compare locked versions
        id: versions
        run: |
          uv run --no-project --python 3.12 python scripts/ytdlp_lock_versions.py `
            "$env:RUNNER_TEMP/uv.lock.before" uv.lock
          if ($LASTEXITCODE -ne 0) { throw "Could not read the locked versions" }

      - name: Install and test
        if: steps.versions.outputs.changed == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv sync --locked
          uv run pytest

      - name: Open pull request
        if: steps.versions.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/update-yt-dlp
          delete-branch: true
          add-paths: uv.lock
          commit-message: ${{ steps.versions.outputs.title }}
          title: ${{ steps.versions.outputs.title }}
          body: |
            Automated weekly update of `uv.lock`.

            - yt-dlp: ${{ steps.versions.outputs.ytdlp_change }}
            - yt-dlp-ejs: ${{ steps.versions.outputs.ejs_change }}

            Tests passed on windows-latest before this PR was opened.
            Merge it, then tag a new release so users get the new extractor fixes.
